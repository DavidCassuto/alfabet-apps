<!DOCTYPE html>
<html lang="he" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>אָלֶף-בֵּית</title>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@700;900&family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

html,body{height:100%;overflow:hidden}
body{font-family:'Fredoka',sans-serif;background:#fdf8f0;
     display:flex;flex-direction:column;padding:6px 10px 4px;
     height:100dvh; /* dynamic viewport = excludes browser chrome */}

.app{display:flex;flex-direction:column;height:100%;overflow:hidden;max-width:780px;margin:0 auto;width:100%}

/* ── Header ── */
.hdr{text-align:center;padding:2px 0 4px;flex-shrink:0}
.hdr-he{font-family:'Frank Ruhl Libre','David','Arial Hebrew',serif;
         font-size:clamp(22px,6vw,38px);font-weight:900;color:#2d2417;
         direction:rtl;line-height:1;letter-spacing:3px}
.hdr-en{font-size:9px;color:#aaa090;letter-spacing:5px;text-transform:uppercase;margin-top:2px}

/* ── Info panel ── */
.panel{background:#fff;border:1.5px solid #e8dfc8;border-radius:16px;
       padding:8px 12px;margin-bottom:6px;flex-shrink:0;
       display:flex;align-items:center;gap:12px;
       box-shadow:0 2px 10px rgba(180,150,80,.07)}
.panel.empty{border-style:dashed;background:#fffdf7}
.empty-msg{font-size:13px;color:#bba880;text-align:center;padding:4px;width:100%}

.big{font-family:'Frank Ruhl Libre','David','Arial Hebrew',serif;
     font-size:clamp(48px,11vw,72px);font-weight:900;line-height:1;
     border-radius:12px;padding:2px 12px;text-align:center;flex-shrink:0}

.dbody{flex:1;min-width:0}

/* top line: Hebrew name + sound badge inline */
.d-top{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:2px}
.d-he{font-family:'Frank Ruhl Libre','David','Arial Hebrew',serif;
      font-size:16px;direction:rtl;color:#2d2417}
.d-en{font-size:18px;font-weight:600;color:#2d2417}
.d-sound{font-size:10px;color:#9a8a70;background:#f5efe0;border-radius:20px;
          display:inline-block;padding:1px 9px}

/* word row */
.d-word{background:#f9f5ec;border:1px solid #e8dfc8;border-radius:10px;
        padding:5px 9px;display:flex;align-items:center;gap:7px;margin-bottom:4px}
.d-emoji{font-size:20px;flex-shrink:0}
.d-word-he{font-family:'Frank Ruhl Libre','David','Arial Hebrew',serif;
            font-size:14px;direction:rtl;color:#2d2417}
.d-word-sub{font-size:10px;color:#9a8a70}

.speak-btn{display:inline-flex;align-items:center;gap:4px;
           background:#f5efe0;border:1px solid #ddd0b0;border-radius:20px;
           padding:3px 10px;font-family:'Fredoka',sans-serif;font-size:11px;
           color:#7a6040;cursor:pointer;transition:background .15s}
.speak-btn:hover,.speak-btn:active{background:#ede4cc}

/* word mode */
@keyframes pop{0%{transform:scale(.3) rotate(-18deg);opacity:0}65%{transform:scale(1.18) rotate(4deg)}100%{transform:scale(1) rotate(0);opacity:1}}
.pop{animation:pop .38s cubic-bezier(.34,1.56,.64,1) both}
@keyframes letterIn{0%{transform:translateX(60px) scale(.65);opacity:0}68%{transform:translateX(-4px) scale(1.1);opacity:1}100%{transform:translateX(0) scale(1);opacity:1}}

.wmode{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center;width:100%}
.wemoji-big{font-size:clamp(36px,9vw,54px);flex-shrink:0;animation:pop .35s ease both}
.wbody{text-align:center;flex:1;min-width:150px}
.wword{direction:rtl;font-size:0;text-align:center;margin-bottom:4px;line-height:1}
.wltr{font-family:'Frank Ruhl Libre','David','Arial Hebrew',serif;
      font-size:clamp(44px,11vw,68px);font-weight:900;color:#2d2417;
      display:inline-block;animation:letterIn .42s cubic-bezier(.34,1.56,.64,1) both}
.wtr{font-size:16px;font-weight:600;color:#5a4020;margin-bottom:1px}
.wen{font-size:12px;color:#9a8a70;margin-bottom:4px}
.wbadge{font-size:9px;color:#c0b090;background:#f9f5ec;border:1px solid #e8dfc8;
         border-radius:20px;display:inline-block;padding:2px 10px;margin-bottom:5px}
.wtap{font-size:10px;color:#b0a080;margin-top:3px}

/* ── Progress ── */
.prog-row{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;margin-bottom:1px;flex-shrink:0}
.dot{width:7px;height:7px;border-radius:50%;background:#e8dfc8;border:1px solid #d4c9aa;transition:all .35s}
.dot.lit{background:#5a8c2a;border-color:#4a7220}
.prog-lbl{text-align:center;font-size:10px;color:#b0a080;margin-bottom:5px;flex-shrink:0}

/* ── Letter grid ── */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));
      gap:7px;flex:1;align-content:start;overflow:hidden}
.card{border-radius:14px;padding:9px 3px 6px;cursor:pointer;text-align:center;
      border:2px solid transparent;transition:transform .15s,box-shadow .15s;user-select:none}
.card:hover{transform:translateY(-2px) scale(1.05);box-shadow:0 3px 10px rgba(0,0,0,.11)}
.card:active{transform:scale(.95)}
.card.on{transform:translateY(-2px) scale(1.06);border-color:rgba(0,0,0,.2);box-shadow:0 4px 12px rgba(0,0,0,.13)}
.card-ltr{font-family:'Frank Ruhl Libre','David','Arial Hebrew',serif;font-size:28px;font-weight:700;line-height:1.15}
.card-en{font-size:9px;margin-top:2px;opacity:.8;font-weight:600}
.card-chk{font-size:10px;margin-top:1px;opacity:.85}

.c0{background:#e8e4fb;color:#3C3489}.c1{background:#c8f0e2;color:#085041}.c2{background:#fcdccc;color:#712B13}
.c3{background:#cce4f8;color:#0C447C}.c4{background:#fde8ae;color:#633806}.c5{background:#f8d4e4;color:#72243E}

footer{text-align:center;font-size:10px;color:#c0b090;padding:2px 0;flex-shrink:0}

@media(prefers-color-scheme:dark){
  body{background:#1a1610}
  .panel{background:#231f18;border-color:#3a3428;box-shadow:none}
  .panel.empty{background:#1e1b15}.empty-msg{color:#7a6a50}
  .hdr-he{color:#f0e8d0}
  .d-he,.d-en,.wltr{color:#f0e8d0}
  .d-sound,.wbadge{background:#2e2820;color:#7a6a50;border-color:#3a3428}
  .d-word{background:#2a2418;border-color:#3a3428}
  .wtr{color:#d0b880}.wen{color:#7a6a50}.wtap{color:#6a5a40}
  .speak-btn{background:#2e2820;border-color:#4a4030;color:#a0906a}
  .prog-lbl{color:#7a6a50}.dot{background:#3a3428;border-color:#4a4030}
  .dot.lit{background:#3d6618;border-color:#3d6618}
  footer{color:#6a5a40}
  .c0{background:#2a2560;color:#CECBF6}.c1{background:#0a3528;color:#9FE1CB}.c2{background:#4a1e10;color:#F5C4B3}
  .c3{background:#0a2a50;color:#B5D4F4}.c4{background:#3a2205;color:#FAC775}.c5{background:#3a1828;color:#F4C0D1}
}
</style>

const visited=new Set();
const clicks=new Array(22).fill(0);
let active=-1;
let audioCtx=null;

function getCtx(){
  if(!audioCtx){try{audioCtx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}
  return audioCtx;
}

function swoosh(){
  const ctx=getCtx();if(!ctx)return;
  try{
    const dur=0.24,sr=ctx.sampleRate;
    const buf=ctx.createBuffer(1,Math.floor(sr*dur),sr);
    const d=buf.getChannelData(0);
    for(let i=0;i<d.length;i++){const t=i/d.length;d[i]=(Math.random()*2-1)*Math.pow(1-t,1.4)*0.6;}
    const src=ctx.createBufferSource();src.buffer=buf;
    const f=ctx.createBiquadFilter();f.type='bandpass';
    f.frequency.setValueAtTime(300,ctx.currentTime);
    f.frequency.exponentialRampToValueAtTime(5000,ctx.currentTime+dur);
    f.Q.value=1.0;
    const g=ctx.createGain();
    g.gain.setValueAtTime(0.6,ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+dur);
    src.connect(f);f.connect(g);g.connect(ctx.destination);
    src.start();
  }catch(e){}
}

function splitHebrew(str){
  const res=[];let cur='';
  for(const ch of str){
    const cp=ch.codePointAt(0);
    if(cp>=0x05D0&&cp<=0x05EA){if(cur)res.push(cur);cur=ch;}
    else cur+=ch;
  }
  if(cur)res.push(cur);return res;
}

const panel=document.getElementById('panel');
const plbl=document.getElementById('plbl');
const prog=document.getElementById('progress');
const grid=document.getElementById('grid');

L.forEach((_,i)=>{
  const d=document.createElement('div');d.className='dot';d.id='dt'+i;prog.appendChild(d);
});

L.forEach((lt,i)=>{
  const c=document.createElement('div');
  c.className='card c'+lt.c;c.id='cd'+i;
  c.innerHTML=`<div class="card-ltr">${lt.l}</div><div class="card-en">${lt.e}</div><div class="card-chk" id="ck${i}"></div>`;
  c.addEventListener('click',()=>sel(i));
  grid.appendChild(c);
});

function updateLabel(){
  const n=visited.size;
  plbl.textContent=n===22?'🎉 כָּל הַכָּבוֹד! All 22 letters discovered!':n+' of 22 letters discovered';
}

function showLetterInfo(lt,i){
  speakHebrew(lt.n);
  panel.classList.remove('empty');
  panel.innerHTML=`
    <div class="big c${lt.c} pop">${lt.l}</div>
    <div class="dbody">
      <div class="d-top">
        <span class="d-he">${lt.n}</span>
        <span class="d-en">${lt.e}</span>
        <span class="d-sound">${lt.s}</span>
      </div>
      <div class="d-word">
        <span class="d-emoji">${lt.em}</span>
        <div><div class="d-word-he">${lt.w}</div><div class="d-word-sub">${lt.we} · ${lt.wm}</div></div>
      </div>
      <button class="speak-btn" onclick="say(${i})">🔊 Hear it</button>
    </div>`;
}

function showWord(lt,wordIdx){
  swoosh();
  const wd=lt.words[wordIdx];
  speakHebrew(wd.w);
  const chars=splitHebrew(wd.w);
  const chHTML=chars.map((ch,idx)=>
    `<span class="wltr" style="animation-delay:${idx*75}ms">${ch}</span>`
  ).join('');
  const total=lt.words.length;
  panel.classList.remove('empty');
  panel.innerHTML=`
    <div class="wmode">
      <div class="wemoji-big">${wd.em}</div>
      <div class="wbody">
        <div class="wbadge">word ${wordIdx+1} of ${total}</div>
        <div class="wword">${chHTML}</div>
        <div class="wtr">${wd.tr}</div>
        <div class="wen">${wd.en}</div>
        <div class="wtap">tap ${lt.e} again for next word →</div>
      </div>
    </div>`;
}

function sel(i){
  const lt=L[i];
  if(active>=0&&active!==i)document.getElementById('cd'+active).classList.remove('on');
  active=i;
  document.getElementById('cd'+i).classList.add('on');
  if(!visited.has(i)){
    visited.add(i);
    document.getElementById('dt'+i).classList.add('lit');
    document.getElementById('ck'+i).textContent='✓';
    updateLabel();
  }
  const c=clicks[i];
  if(c===0){showLetterInfo(lt,i);}
  else{showWord(lt,(c-1)%lt.words.length);}
  clicks[i]++;
}

// Pre-cache Hebrew voice so speak() can fire synchronously inside tap handler (required for iOS)
let heVoice=null;
function cacheVoices(){
  const vs=speechSynthesis.getVoices();
  if(vs.length) heVoice=vs.find(v=>v.lang&&v.lang.startsWith('he'))||null;
}
if(window.speechSynthesis){
  speechSynthesis.addEventListener('voiceschanged',cacheVoices);
  cacheVoices();
}

function speakHebrew(text){
  if(!window.speechSynthesis)return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  if(heVoice){u.voice=heVoice;u.lang='he-IL';}
  else{u.lang='he-IL';u.rate=0.82;u.pitch=1.05;}
  speechSynthesis.speak(u);
}

function say(i){
  speakHebrew(L[i].n);
}

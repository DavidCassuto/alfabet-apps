<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Het Nederlandse Alfabet</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,400&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

:root{
  --bg:#f0ebe0;
  --panel-bg:#ffffff;
  --panel-border:#ddd5c0;
  --text-dark:#2a2218;
  --text-mid:#7a6a50;
  --text-light:#b0a080;
  --accent:#2a4a6a;
  --accent2:#8a3a1a;
  --shadow:rgba(60,40,10,.10);
  --c0-bg:#daeaf0;--c0-tx:#1a4560;
  --c1-bg:#f2e4d4;--c1-tx:#8a3a18;
  --c2-bg:#eae4f2;--c2-tx:#4a3070;
  --c3-bg:#deeede;--c3-tx:#2a5830;
  --c4-bg:#f4ecd0;--c4-tx:#7a5010;
  --c5-bg:#f0dce8;--c5-tx:#7a2858;
}

html,body{height:100%;overflow:hidden}
body{
  font-family:'Lato',sans-serif;
  background:var(--bg);
  background-image:
    radial-gradient(ellipse at 20% 10%, rgba(42,74,106,.06) 0%, transparent 60%),
    radial-gradient(ellipse at 80% 90%, rgba(138,58,26,.05) 0%, transparent 60%);
  display:flex;flex-direction:column;
  padding:6px 10px 4px;
  height:100dvh;
}

.app{display:flex;flex-direction:column;height:100%;overflow:hidden;max-width:780px;margin:0 auto;width:100%}

/* ── Header ── */
.hdr{text-align:center;padding:2px 0 5px;flex-shrink:0;position:relative}
.hdr-title{
  font-family:'Playfair Display',serif;
  font-size:clamp(20px,5.5vw,34px);
  font-weight:900;
  color:var(--text-dark);
  letter-spacing:2px;
  line-height:1;
}
.hdr-sub{font-size:9px;color:var(--text-light);letter-spacing:6px;text-transform:uppercase;margin-top:3px;font-weight:300}
.hdr-rule{height:1px;background:linear-gradient(90deg,transparent,var(--panel-border),transparent);margin-top:5px}

/* ── Info panel ── */
.panel{
  background:var(--panel-bg);
  border:1px solid var(--panel-border);
  border-radius:14px;
  padding:8px 13px;
  margin-bottom:6px;
  flex-shrink:0;
  display:flex;align-items:center;gap:13px;
  box-shadow:0 2px 16px var(--shadow);
}
.panel.empty{border-style:dashed;background:transparent;box-shadow:none}
.empty-msg{font-size:12px;color:var(--text-light);text-align:center;padding:4px;width:100%;
           font-style:italic;letter-spacing:.5px}

.big{
  font-family:'Playfair Display',serif;
  font-size:clamp(46px,11vw,70px);
  font-weight:900;line-height:1;
  border-radius:10px;padding:2px 13px;
  text-align:center;flex-shrink:0;
  letter-spacing:-1px;
}
.dbody{flex:1;min-width:0}
.d-top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:3px}
.d-letter-name{font-family:'Playfair Display',serif;font-size:17px;font-weight:700;color:var(--text-dark);font-style:italic}
.d-sound{font-size:10px;color:var(--text-mid);background:var(--bg);border-radius:20px;
          display:inline-block;padding:1px 9px;border:1px solid var(--panel-border)}
.d-word{background:var(--bg);border:1px solid var(--panel-border);border-radius:9px;
        padding:5px 9px;display:flex;align-items:center;gap:8px;margin-bottom:4px}
.d-emoji{font-size:19px;flex-shrink:0}
.d-word-nl{font-family:'Playfair Display',serif;font-size:14px;color:var(--text-dark);font-weight:700}
.d-word-sub{font-size:10px;color:var(--text-mid);margin-top:1px}

.speak-btn{
  display:inline-flex;align-items:center;gap:4px;
  background:transparent;border:1px solid var(--panel-border);
  border-radius:20px;padding:3px 11px;
  font-family:'Lato',sans-serif;font-size:11px;font-weight:700;
  color:var(--text-mid);cursor:pointer;letter-spacing:.5px;
  transition:all .15s;text-transform:uppercase;
}
.speak-btn:hover,.speak-btn:active{background:var(--bg);color:var(--text-dark)}

/* ── Word mode ── */
@keyframes pop{0%{transform:scale(.3) rotate(-12deg);opacity:0}65%{transform:scale(1.15) rotate(3deg)}100%{transform:scale(1) rotate(0);opacity:1}}
.pop{animation:pop .38s cubic-bezier(.34,1.56,.64,1) both}
@keyframes slideIn{0%{transform:translateY(20px);opacity:0}100%{transform:translateY(0);opacity:1}}

.wmode{display:flex;align-items:center;gap:13px;flex-wrap:wrap;justify-content:center;width:100%}
.wemoji-big{font-size:clamp(34px,9vw,52px);flex-shrink:0;animation:pop .35s ease both}
.wbody{text-align:center;flex:1;min-width:150px}
.wword{font-family:'Playfair Display',serif;font-size:clamp(40px,10vw,64px);font-weight:900;
       color:var(--text-dark);text-align:center;margin-bottom:3px;line-height:1;
       animation:slideIn .3s ease both}
.wtr{font-size:13px;font-weight:700;color:var(--text-mid);margin-bottom:1px;letter-spacing:.3px}
.wen{font-size:11px;color:var(--text-light);margin-bottom:4px;font-style:italic}
.wbadge{font-size:9px;color:var(--text-light);background:var(--bg);border:1px solid var(--panel-border);
         border-radius:20px;display:inline-block;padding:2px 10px;margin-bottom:5px;
         letter-spacing:.5px;text-transform:uppercase}
.wtap{font-size:10px;color:var(--text-light);margin-top:2px;font-style:italic}

/* ── Progress ── */
.prog-row{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;margin-bottom:1px;flex-shrink:0}
.dot{width:7px;height:7px;border-radius:50%;background:var(--panel-border);border:1px solid #ccc0a0;transition:all .35s}
.dot.lit{background:var(--accent);border-color:var(--accent)}
.prog-lbl{text-align:center;font-size:9px;color:var(--text-light);margin-bottom:5px;flex-shrink:0;
           letter-spacing:.5px;text-transform:uppercase;font-weight:300}

/* ── Grid ── */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(66px,1fr));
  gap:6px;flex:1;align-content:start;overflow:hidden;
}
.card{
  border-radius:10px;padding:8px 2px 5px;cursor:pointer;text-align:center;
  border:1.5px solid transparent;
  transition:transform .15s,box-shadow .15s,border-color .15s;
  user-select:none;
}
.card:hover{transform:translateY(-2px) scale(1.04);box-shadow:0 4px 14px var(--shadow)}
.card:active{transform:scale(.95)}
.card.on{transform:translateY(-2px) scale(1.05);border-color:rgba(0,0,0,.18);box-shadow:0 4px 14px var(--shadow)}
.card-ltr{font-family:'Playfair Display',serif;font-size:26px;font-weight:900;line-height:1.1;letter-spacing:-1px}
.card-name{font-size:8.5px;margin-top:2px;opacity:.75;font-weight:700;letter-spacing:.5px;text-transform:uppercase}
.card-chk{font-size:10px;margin-top:1px;opacity:.85}

.c0{background:var(--c0-bg);color:var(--c0-tx)}
.c1{background:var(--c1-bg);color:var(--c1-tx)}
.c2{background:var(--c2-bg);color:var(--c2-tx)}
.c3{background:var(--c3-bg);color:var(--c3-tx)}
.c4{background:var(--c4-bg);color:var(--c4-tx)}
.c5{background:var(--c5-bg);color:var(--c5-tx)}

footer{text-align:center;font-size:9px;color:var(--text-light);padding:2px 0;flex-shrink:0;
       letter-spacing:1px;font-weight:300;text-transform:uppercase}

@media(prefers-color-scheme:dark){
  :root{
    --bg:#1e1a14;--panel-bg:#2a2418;--panel-border:#3a3020;
    --text-dark:#f0e8d0;--text-mid:#9a8a68;--text-light:#6a5a40;
    --shadow:rgba(0,0,0,.4);
    --c0-bg:#1a3040;--c0-tx:#8acce0;
    --c1-bg:#3a200e;--c1-tx:#e0a070;
    --c2-bg:#2a2040;--c2-tx:#b0a0e0;
    --c3-bg:#1a3020;--c3-tx:#80c888;
    --c4-bg:#3a2c10;--c4-tx:#d8b060;
    --c5-bg:#3a1828;--c5-tx:#d888b0;
  }
}

const visited=new Set();
const clicks=new Array(26).fill(0);
let active=-1;
let audioCtx=null;

function getCtx(){if(!audioCtx){try{audioCtx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}return audioCtx;}

function swoosh(){
  const ctx=getCtx();if(!ctx)return;
  try{
    const dur=0.22,sr=ctx.sampleRate;
    const buf=ctx.createBuffer(1,Math.floor(sr*dur),sr);
    const d=buf.getChannelData(0);
    for(let i=0;i<d.length;i++){const t=i/d.length;d[i]=(Math.random()*2-1)*Math.pow(1-t,1.6)*0.5;}
    const src=ctx.createBufferSource();src.buffer=buf;
    const f=ctx.createBiquadFilter();f.type='bandpass';
    f.frequency.setValueAtTime(400,ctx.currentTime);
    f.frequency.exponentialRampToValueAtTime(4000,ctx.currentTime+dur);
    f.Q.value=1.2;
    const g=ctx.createGain();
    g.gain.setValueAtTime(0.5,ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+dur);
    src.connect(f);f.connect(g);g.connect(ctx.destination);
    src.start();
  }catch(e){}
}

const panel=document.getElementById('panel');
const plbl=document.getElementById('plbl');
const prog=document.getElementById('progress');
const grid=document.getElementById('grid');

L.forEach((_,i)=>{
  const d=document.createElement('div');d.className='dot';d.id='dt'+i;prog.appendChild(d);
});

L.forEach((lt,i)=>{
  const c=document.createElement('div');
  c.className='card c'+lt.c;c.id='cd'+i;
  c.innerHTML=`<div class="card-ltr">${lt.l}</div><div class="card-name">${lt.n}</div><div class="card-chk" id="ck${i}"></div>`;
  c.addEventListener('click',()=>sel(i));
  grid.appendChild(c);
});

function updateLabel(){
  const n=visited.size;
  plbl.textContent=n===26?'✦ Alle 26 letters ontdekt — Gefeliciteerd! ✦':n+' van 26 letters ontdekt';
}

function showLetterInfo(lt,i){
  speakDutch(lt.l+'. '+lt.n);
  panel.classList.remove('empty');
  panel.innerHTML=`
    <div class="big c${lt.c} pop">${lt.l}</div>
    <div class="dbody">
      <div class="d-top">
        <span class="d-letter-name">${lt.n}</span>
        <span class="d-sound">${lt.s}</span>
      </div>
      <div class="d-word">
        <span class="d-emoji">${lt.em}</span>
        <div><div class="d-word-nl">${lt.w}</div><div class="d-word-sub">${lt.wm}</div></div>
      </div>
      <button class="speak-btn" onclick="say(${i})">♪ Hoor het</button>
    </div>`;
}

function showWord(lt,wordIdx){
  swoosh();
  const wd=lt.words[wordIdx];
  speakDutch(wd.w);
  const total=lt.words.length;
  panel.classList.remove('empty');
  panel.innerHTML=`
    <div class="wmode">
      <div class="wemoji-big">${wd.em}</div>
      <div class="wbody">
        <div class="wbadge">woord ${wordIdx+1} van ${total}</div>
        <div class="wword">${wd.w}</div>
        <div class="wen">${wd.en}</div>
        <div class="wtap">tik ${lt.l} opnieuw voor volgend woord →</div>
      </div>
    </div>`;
}

function sel(i){
  const lt=L[i];
  if(active>=0&&active!==i)document.getElementById('cd'+active).classList.remove('on');
  active=i;
  document.getElementById('cd'+i).classList.add('on');
  if(!visited.has(i)){
    visited.add(i);
    document.getElementById('dt'+i).classList.add('lit');
    document.getElementById('ck'+i).textContent='✓';
    updateLabel();
  }
  const c=clicks[i];
  if(c===0){showLetterInfo(lt,i);}
  else{showWord(lt,(c-1)%lt.words.length);}
  clicks[i]++;
}

let nlVoice=null;
function cacheVoices(){
  const vs=speechSynthesis.getVoices();
  if(vs.length) nlVoice=vs.find(v=>v.lang&&v.lang.startsWith('nl'))||null;
}
if(window.speechSynthesis){
  speechSynthesis.addEventListener('voiceschanged',cacheVoices);
  cacheVoices();
}

function speakDutch(text){
  if(!window.speechSynthesis)return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  if(nlVoice){u.voice=nlVoice;u.lang='nl-NL';}
  else{u.lang='nl-NL';u.rate=0.85;u.pitch=1.0;}
  speechSynthesis.speak(u);
}

function say(i){speakDutch(L[i].l+'. '+L[i].n);}
